allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir('tools/visual_smoke/src')
        neoForge.runs.client {
            // Automated local capture must never prompt for a Microsoft account.
            devLogin = false
            gameDirectory = project.file('build/rave-preview')
            programArguments.addAll('--quickPlaySingleplayer', 'RavePreview', '--width', '1280', '--height', '900')
            systemProperty 'cabinmod.visualSmoke', 'true'
            if (project.hasProperty('raveRevealReview')) {
                systemProperty 'cabinmod.visualSmoke.revealReview', 'true'
                systemProperty 'cabinmod.visualSmoke.revealFps', project.findProperty('revealFps') ?: '60'
                systemProperty 'cabinmod.visualSmoke.revealSide', project.findProperty('revealSide') ?: 'front'
            }
            if (project.hasProperty('raveLightReview')) systemProperty 'cabinmod.visualSmoke.lightReview', 'true'
            if (project.hasProperty('robeReview')) {
                systemProperty 'cabinmod.visualSmoke.robeReview', 'true'
                systemProperty 'cabinmod.visualSmoke.robeFps', project.findProperty('robeFps') ?: '60'
            }
        }
    }
}
