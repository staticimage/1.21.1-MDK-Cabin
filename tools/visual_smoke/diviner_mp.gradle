// Live two-player Transient Diviner test: a dedicated server and two offline clients (Alice, Bob) on this machine.
//     bash tools/visual_smoke/diviner_mp.sh  (starts all three and waits; screenshots in build/mp/<name>/screenshots)
// or by hand, each in its own terminal:
//     ./gradlew -I tools/visual_smoke/diviner_mp.gradle runServer        -PmpRole=server --no-configuration-cache
//     ./gradlew -I tools/visual_smoke/diviner_mp.gradle runClientOffline -PmpRole=alice  --no-configuration-cache
//     ./gradlew -I tools/visual_smoke/diviner_mp.gradle runClientOffline -PmpRole=bob    --no-configuration-cache
// The scenario lives in tools/visual_smoke/src/net/austin/cabinmod/debug/DivinerMultiplayerSmoke.java.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir('tools/visual_smoke/src')
        def role = project.findProperty('mpRole') ?: 'server'
        if (role == 'server') {
            neoForge.runs.server {
                gameDirectory = project.file('build/mp/server')
                systemProperty 'cabinmod.divinerMp', 'server'
            }
        } else {
            neoForge.runs.clientOffline {
                gameDirectory = project.file("build/mp/${role}")
                devLogin = false
                programArguments.addAll('--quickPlayMultiplayer', 'localhost:25599', '--username', role.capitalize(),
                        '--width', '960', '--height', '540')
                systemProperty 'cabinmod.divinerMp', role
            }
        }
    }
}
